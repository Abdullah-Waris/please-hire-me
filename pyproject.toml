[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "please-hire-me"
version = "0.3.0"
description = "Automatic applications with verified facts and durable submission tracking"
requires-python = ">=3.11"
dependencies = ["playwright>=1.55,<2", "pypdf>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
hireme = "hireme.cli:main"

[tool.setuptools.packages.find]
include = ["hireme*"]

[tool.setuptools.package-data]
hireme = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
